en:
  site_settings:
    gemini_ocr_enabled: "[Sorumatik OCR & AI] Enable plugin and OCR endpoint (/sorumatik/ocr)"
    gemini_ocr_api_key: "[Sorumatik OCR & AI] Google Gemini API Secret Key (securely used server-side for OCR and AI operations)"
    sorumatik_ocr_api_key: "[Sorumatik OCR & AI] Google Gemini API Key (alternative alias for gemini_ocr_api_key)"
    gemini_ocr_rate_limit_per_minute: "[Sorumatik OCR & AI] Maximum OCR requests per user per minute (default: 30)"
    gemini_ocr_model: "[Sorumatik OCR & AI] Google Gemini model for OCR question recognition (default: gemini-2.5-flash-lite)"
    gemini_ai_solve_enabled: "[Sorumatik OCR & AI] Enable Sorumatik direct AI streaming question solve endpoint"
    gemini_ai_solve_model: "[Sorumatik OCR & AI] Google Gemini model for AI question solving (default: gemini-2.5-flash)"
    gemini_ai_solve_bot_username: "[Sorumatik OCR & AI] Bot username that authors solution post in forum (default: sorumatik_ai)"
    gemini_ai_solve_rate_limit_per_minute: "[Sorumatik OCR & AI] Maximum AI question solve requests per user per minute (default: 15)"
    gemini_ai_solve_thinking_level: "[Sorumatik OCR & AI] Reasoning depth/thinking level for AI solver (default, minimal, low, medium, high)"
    gemini_ai_solve_system_prompt: "[Sorumatik OCR & AI] System prompt for AI question solver"
    gemini_ai_suppress_automation_bot_username: "[Sorumatik OCR & AI] Discourse automation bot to suppress on mobile topics (default: sorumatik_uzman_bot)"
    gemini_ai_tools_enabled: "[Sorumatik OCR & AI] Enable Sorumatik edge architecture for AI study tools (quiz, summary, etc.)"
    gemini_ai_tools_model: "[Sorumatik OCR & AI] Google Gemini model for AI tools (default: gemini-2.5-flash)"
    gemini_document_quiz_model: "[Sorumatik OCR & AI] Google Gemini model for Document/PDF Quiz module (default: gemini-2.5-flash)"
    gemini_ai_rate_limit_per_minute: "[Sorumatik OCR & AI] Maximum general AI proxy requests per user per minute (default: 30)"
    gemini_ai_allowed_models: "[Sorumatik OCR & AI] Pipe-separated allowlist of economic Gemini Flash/Flash-Lite models permitted on client proxy requests"
    gemini_ai_solve_category_ids: "[Sorumatik OCR & AI] Pipe-separated category IDs eligible for automatic AI question solving (empty = all public categories)"
    gemini_tts_model: "[Sorumatik OCR & AI] Google Gemini TTS model for audio synthesis (default: gemini-3.8-flash-lite-tts)"
    gemini_blackboard_model: "[Sorumatik OCR & AI] Google Gemini model for Blackboard interactive lessons (default: gemini-3.8-flash)"
    gemini_blackboard_thinking_level: "[Sorumatik OCR & AI] Thinking level for Blackboard interactive lessons (default: low)"
    sorumatik_ai_generation_streaming_enabled: "[Sorumatik OCR & AI] Deliver live AI generations through MessageBus"
    sorumatik_ai_generation_streaming_percent: "[Sorumatik OCR & AI] Percentage of users receiving live AI generation events (0-100)"
    gemini_legacy_client_fallback: "[Sorumatik OCR & AI] Return API key to legacy mobile clients (keep false for security)"
    sorumatik_client_generation_enabled: "[Sorumatik OCR & AI] Mobile app generates AI answers on the device with Gemini and saves them (protocol 4). Turn off to fall back to server generation"
    sorumatik_client_heartbeat_timeout_seconds: "[Sorumatik OCR & AI] Seconds without a device heartbeat before the server takes over a device-generated answer"
    sorumatik_mobile_gemini_api_key: "[Sorumatik OCR & AI] Optional Gemini API key sent to signed-in mobile users for on-device answers (restrict it to the app packages in Google Cloud). Empty = protocol 4 stays off and the server keeps generating"
    gemini_ai_proxy_max_concurrent_streams: "[Sorumatik OCR & AI] Maximum concurrent Gemini streams through the AI proxy across all web workers (about half of UNICORN_WORKERS)"
  sorumatik_ocr:
    api_key_missing: "Gemini OCR API key is not configured on the server."
    image_missing: "No image file provided in request."
    rate_limited: "Too many requests. Please wait a moment."
    gemini_error: "Gemini AI service temporarily unavailable."
    auth_required: "Authentication or a valid client is required for this operation."
    topic_missing: "Valid topic_id is missing."
    bot_not_found: "Configured bot user was not found."
